<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banquete do Guloso</title>
  <link rel="stylesheet" href="jogocss.css">
</head>
<body>

  <div id="cena">
    
    <button class="seta" id="esq" aria-label="Girar para a esquerda"></button>
    <button class="seta" id="dir" aria-label="Girar para a direita"></button>
    
    <button class="porta" id="porta-hall-quarto" data-aqui="hall-2" data-para="quarto-0"></button>
    <button class="porta" id="porta-quarto-hall" data-aqui="quarto-3" data-para="hall-2"></button>
    <button class="porta" id="porta-quarto-banheiro" data-aqui="quarto-1" data-para="banheiro-0"></button>
    <button class="porta" id="porta-banheiro-quarto" data-aqui="banheiro-0" data-para="quarto-1"></button>
    <button class="porta" id="porta-hall-cozinha" data-aqui="hall-0" data-para="cozinha-0"></button>
    <button class="porta" id="porta-cozinha-hall" data-aqui="cozinha-3" data-para="hall-0"></button>
    <button class="porta" id="porta-cozinha-salaJantar" data-aqui="cozinha-2" data-para="salaJantar-0"></button>
    <button class="porta" id="porta-salaJantar-cozinha" data-aqui="salaJantar-3" data-para="cozinha-2"></button>
    <button class="porta" id="porta-salaJantar-calabouco" data-aqui="salaJantar-2" data-para="calabouco-0"></button>
    <button class="porta" id="porta-calabouco-salaJantar" data-aqui="calabouco-1" data-para="salaJantar-2"></button>
    
  </div>

  <script src="trocadecomodos.js"></script>
</body>
</html>
