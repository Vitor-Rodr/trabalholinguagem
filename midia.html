<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mídia - O Banquete Guloso</title>
  <link rel="icon" href="assets/images/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/midia.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="nav-left">
        <a href="index.html" class="brand-logo">
          <img src="assets/images/logo.png" alt="Logo O Banquete Guloso" class="logo-img">
          <span>O Banquete Guloso</span>
        </a>

        <ul class="nav-menu" id="menu">
          <li><a href="historia.html">História</a></li>
          <li><a href="informacoes.html">Informações</a></li>
          <li><a href="midia.html" class="active" aria-current="page">Mídia</a></li>
          <li><a href="suporte.html">Suporte</a></li>
          <li><a href="social.html">Social</a></li>
        </ul>
      </div>

      <div class="nav-right">
        <a href="informacoes.html" class="btn-nav-action">Jogue Agora</a>
        <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">&#9776;</button>
      </div>
    </nav>
  </header>

  <section class="hero-section">
    <div class="page-container largo">
      <h1 class="page-title">Cenários do jogo</h1>

      <div class="media-grid-layout">

        <div class="scenarios-grid">

          <button type="button" class="scenario-card active" data-titulo="Sala 1: Hall de Entrada" data-descricao="O ponto de partida do jogo. Um hall escuro e intimidador onde você acorda e precisa dar os primeiros passos com cautela." data-imagem="assets/images/cenarios/hall-de-entrada.jpg">
            <img src="assets/images/cenarios/hall-de-entrada.jpg" alt="Hall de entrada" class="scenario-thumb">
            <div class="scenario-info"><span class="scenario-title">Sala 1: Hall de Entrada</span></div>
          </button>

          <button type="button" class="scenario-card" data-titulo="Sala 2: Cozinha" data-descricao="Uma cozinha rústica e tensa. Onde o perigo começa a se aproximar e cada barulho pode ser o Vítor chegando." data-imagem="assets/images/cenarios/cozinha.jpg">
            <img src="assets/images/cenarios/cozinha.jpg" alt="Cozinha" class="scenario-thumb">
            <div class="scenario-info"><span class="scenario-title">Sala 2: Cozinha</span></div>
          </button>

          <button type="button" class="scenario-card" data-titulo="Sala 3: Banquete" data-descricao="A sala principal do banquete guloso. Uma mesa longa e macabra cercada de mistérios e armadilhas." data-imagem="assets/images/cenarios/banquete.jpg">
            <img src="assets/images/cenarios/banquete.jpg" alt="Banquete" class="scenario-thumb">
            <div class="scenario-info"><span class="scenario-title">Sala 3: Banquete</span></div>
          </button>

          <button type="button" class="scenario-card" data-titulo="Sala 4: Banheiro" data-descricao="Um ambiente apertado e úmido. Um bom lugar para se esconder temporariamente, mas cuidado para não ficar encurralado." data-imagem="assets/images/cenarios/banheiro.jpg">
            <img src="assets/images/cenarios/banheiro.jpg" alt="Banheiro" class="scenario-thumb">
            <div class="scenario-info"><span class="scenario-title">Sala 4: Banheiro</span></div>
          </button>

          <button type="button" class="scenario-card" data-titulo="Sala 5: Quarto" data-descricao="O dormitório misterioso. Gavetas trancadas e pistas importantes podem estar escondidas por aqui." data-imagem="assets/images/cenarios/quarto.jpg">
            <img src="assets/images/cenarios/quarto.jpg" alt="Quarto" class="scenario-thumb">
            <div class="scenario-info"><span class="scenario-title">Sala 5: Quarto</span></div>
          </button>

          <button type="button" class="scenario-card" data-titulo="Sala 6: Saída" data-descricao="O último desafio. A porta final que separa você da liberdade — caso consiga escapar a tempo do Vítor." data-imagem="assets/images/cenarios/saida.jpg">
            <img src="assets/images/cenarios/saida.jpg" alt="Saída" class="scenario-thumb">
            <div class="scenario-info"><span class="scenario-title">Sala 6: Saída</span></div>
          </button>

        </div>

        <div class="inspector-panel">
          <div class="inspector-image-container">
            <img id="insp-img" src="assets/images/cenarios/hall-de-entrada.jpg" alt="Sala 1: Hall de Entrada" class="inspector-img">
          </div>
          <div class="inspector-header">
            <h2 id="insp-title">Sala 1: Hall de Entrada</h2>
          </div>
          <p id="insp-desc" class="inspector-desc">O ponto de partida do jogo. Um hall escuro e intimidador onde você acorda e precisa dar os primeiros passos com cautela.</p>
        </div>

      </div>
    </div>
  </section>

  <script src="js/nav.js"></script>
  <script src="js/midia.js"></script>
</body>
</html>
