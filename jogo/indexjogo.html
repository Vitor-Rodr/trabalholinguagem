<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banquete do Guloso</title>
  <link rel="stylesheet" href="jogocss.css">
  <link rel="stylesheet" href="diario.css">
</head>
<body>
  <!-- Cronômetro regressivo no topo da tela -->
  <div id="cronometro">05:00</div>

  <button type="button" id="btn-abrir-diario">Diário (0)</button>

  <!-- Área principal do cenário -->
  <div id="cena">
    <!-- Setas de rotação lateral -->
    <button class="seta" id="esq" aria-label="Girar para a esquerda"></button>
    <button class="seta" id="dir" aria-label="Girar para a direita"></button>

    <!-- Portas de passagem entre cômodos -->
    <button class="porta" id="porta-hall-quarto" data-aqui="hall-2" data-para="quarto-0"></button>
    <button class="porta" id="porta-quarto-hall" data-aqui="quarto-3" data-para="hall-2"></button>
    <button class="porta" id="porta-quarto-banheiro" data-aqui="quarto-1" data-para="banheiro-0"></button>
    <button class="porta" id="porta-banheiro-quarto" data-aqui="banheiro-0" data-para="quarto-1"></button>
    <button class="porta" id="porta-hall-cozinha" data-aqui="hall-0" data-para="cozinha-0"></button>
    <button class="porta" id="porta-cozinha-hall" data-aqui="cozinha-3" data-para="hall-0"></button>
    <button class="porta" id="porta-cozinha-salaJantar" data-aqui="cozinha-2" data-para="salaJantar-0"></button>
    <button class="porta" id="porta-salaJantar-cozinha" data-aqui="salaJantar-0" data-para="cozinha-2"></button>
    <button class="porta" id="porta-salaJantar-calabouco" data-aqui="salaJantar-3" data-para="calabouco-0"></button>
    <button class="porta" id="porta-calabouco-salaJantar" data-aqui="calabouco-1" data-para="salaJantar-3"></button>

    <!-- Saída provisória da sala de prisão (volta para a sala de jantar) -->
    <button class="porta" id="porta-prisao-salaJantar" data-aqui="prisao-0" data-para="salaJantar-2" aria-label="Voltar para a sala de jantar"></button>

    <!-- Fechadura dourada na grade do calabouço -->
    <button class="porta" id="porta-final-escape" data-aqui="calabouco-0" aria-label="Fechadura dourada"></button>

    <!-- Objetos interativos que mudam a imagem da cena -->
    <button class="interativo-cena" id="tapetevirado" data-aqui="hall-0" data-alterado="hall-0-tapete"></button>
    <button class="interativo-cena" id="gavetainutil" data-aqui="hall-0" data-alterado="hall-0-inutil"></button>
    <button class="interativo-cena" id="armarioinutil" data-aqui="quarto-0" data-alterado="quarto-0-armario"></button>
    <button class="interativo-cena" id="quadroinutil" data-aqui="quarto-0" data-alterado="quarto-0-quadro"></button>
    <button class="interativo-cena" id="despertadorbarulhento" data-aqui="quarto-0" data-alterado="quarto-0-despertador"></button>
    <button class="interativo-cena" id="chavepano" data-aqui="quarto-0" data-alterado="quarto-0-chave" data-item="Chave do Chão" data-imagem="../assets/images/cenarioobj/chavegavetainutil.png"></button>
    <button class="interativo-cena" id="armariobanheiro" data-aqui="banheiro-0" data-alterado="banheiro-0-armario"></button>
    <button class="interativo-cena" id="espelhobanheiro" data-aqui="banheiro-0" data-alterado="banheiro-0-espelho"></button>
    <button class="interativo-cena" id="cortinabanheiro" data-aqui="banheiro-0" data-alterado="banheiro-0-cortina"></button>

    <!-- Resgata as crianças na prisão, envia para o inventário e troca para a cena vazia -->
    <button class="interativo-cena" id="criancasresgatadas" data-aqui="prisao-0" data-alterado="prisao-0-vazia" data-item="Crianças" data-imagem="../assets/images/cenarioobj/criancapng.png"></button>

    <!-- Engrenagem 1 aparece na cena assim que a cortina do banheiro abre -->
    <button class="item-cenario" id="pegar-engrenagem1-banheiro" data-aqui="banheiro-0-cortina" hidden onclick="pegarItem(this, 'Engrenagem 1', '../assets/images/cenarioobj/image7.png')">
      <img src="../assets/images/cenarioobj/image7.png" alt="Engrenagem 1">
    </button>

    <!-- Pé de cabra aparece na cena quando o quadro do quarto é afastado -->
    <button class="item-cenario" id="pegar-pedecabra" data-aqui="quarto-0-quadro" hidden onclick="pegarItem(this, 'Pé de Cabra', '../assets/images/cenarioobj/image1.png')">
      <img src="../assets/images/cenarioobj/image1.png" alt="Pé de cabra">
    </button>

    <!-- Objetos que abrem tela de zoom -->
    <button class="interativo-zoom" id="gavetameio" data-aqui="hall-0" data-zoom="gaveta"></button>
    <button class="interativo-zoom" id="bilhetequadro" data-aqui="hall-1" data-zoom="bilhete"></button>
    <button class="interativo-zoom" id="bilhetecasaco" data-aqui="hall-2" data-zoom="casaco"></button>
    <button class="interativo-zoom" id="caixahall" data-aqui="hall-2" data-zoom="caixa"></button>
    <button class="interativo-zoom" id="quadrog1" data-aqui="quarto-2" data-zoom="quadro1"></button>
    <button class="interativo-zoom" id="quadrog2" data-aqui="quarto-2" data-zoom="quadro2"></button>
    <button class="interativo-zoom" id="quadrog3" data-aqui="quarto-2" data-zoom="quadro3"></button>
    <button class="interativo-zoom" id="quadrog4" data-aqui="quarto-2" data-zoom="quadro4"></button>
    <button class="interativo-zoom" id="quadrog5" data-aqui="quarto-2" data-zoom="quadro5"></button>
    <button class="interativo-zoom" id="canecasuja" data-aqui="quarto-2" data-zoom="caneca"></button>
    <button class="interativo-zoom" id="computadorazul" data-aqui="quarto-2" data-zoom="computador"></button>
    <button class="interativo-zoom" id="fornofechado" data-aqui="cozinha-0" data-zoom="forno"></button>
    <button class="interativo-zoom" id="geladeirasenha" data-aqui="cozinha-1" data-zoom="geladeira"></button>
    <button class="interativo-zoom" id="frangomesa" data-aqui="salaJantar-2" data-zoom="frango"></button>

    <!-- Camada de zoom -->
    <div id="zoom-objeto" hidden>
      <button id="fechar-zoom" aria-label="Voltar para a sala">↓ Voltar</button>

      <!-- Itens coletáveis dentro dos zooms -->
      <button class="item-zoom" id="pegar-chave-gaveta" data-no-zoom="gaveta" onclick="pegarItem(this, 'Chave da Gaveta', '../assets/images/cenarioobj/chavegavetainutil.png')">
        <img src="../assets/images/cenarioobj/chavegavetainutil.png" alt="Chave da Gaveta">
      </button>

      <button class="item-zoom" id="pegar-engrenagem3-caixa" data-no-zoom="caixa" onclick="pegarItem(this, 'Engrenagem 3', '../assets/images/cenarioobj/image4.png')">
        <img src="../assets/images/cenarioobj/image4.png" alt="Engrenagem 3">
      </button>

      <button class="item-zoom" id="pegar-engrenagem2congelada" data-no-zoom="geladeira-aberta" onclick="pegarItem(this, 'Engrenagem 2 Congelada', '../assets/images/cenarioobj/engrenagem2congelada.png')">
        <img src="../assets/images/cenarioobj/engrenagem2congelada.png" alt="Engrenagem 2 Congelada">
      </button>

      <!-- Frango da mesa: com o Pé de Cabra, abre o buraco na mesa -->
      <button class="item-zoom" id="frango-clicavel" data-no-zoom="frango" aria-label="Frango" onclick="clicarFrango()"></button>

      <!-- Buraco da mesa: leva para a sala de prisão -->
      <button class="item-zoom" id="buraco-entrada" data-no-zoom="buraco" aria-label="Buraco na mesa" onclick="entrarNoBuraco()"></button>

      <!-- Painel de senha da geladeira -->
      <div id="senha-geladeira" data-no-zoom="geladeira">
        <p class="titulo-senha">Digite a senha (7 dígitos)</p>
        <input type="text" id="input-senha-geladeira" maxlength="7" inputmode="numeric" placeholder="-------" autocomplete="off">
        <div class="botoes-senha">
          <button type="button" id="btn-confirmar-senha">Confirmar</button>
          <button type="button" id="btn-limpar-senha">Limpar</button>
        </div>
        <p id="aviso-senha-geladeira"></p>
      </div>
    </div>
  </div>

  <!-- Painel do inventário -->
  <div class="painel-inventario">
    <h3>Inventário (<span id="contador-slots">0</span>/6)</h3>
    <div id="inventario" class="grade-inventario"></div>
  </div>

  <!-- Feedback de ações -->
  <p id="mensagem-status" class="status"></p>

  <!-- Tela final com imagem e botão para voltar ao site -->
  <div id="tela-final" hidden>
    <img id="imagem-final" src="" alt="Resultado do jogo">
    <button type="button" id="btn-voltar-site" onclick="voltarPaginaInicial()">Voltar para o site</button>
  </div>

  <div id="modal-diario" hidden>
    <button type="button" id="btn-fechar-diario" aria-label="Fechar diário">✕</button>
    <div class="diario-area-escrita">
      <h2 class="diario-titulo">Diário de Investigação</h2>
      <div id="lista-anotacoes">
        <p class="diario-vazio">Nenhuma pista anotada ainda...</p>
      </div>
    </div>
  </div>

  <!-- Scripts do jogo -->
  <script src="trocadecomodos.js"></script>
  <script src="inventario.js"></script>
  <script src="itenscenario.js"></script>
  <script src="portaseenigmas.js"></script>
  <script src="cronometro.js"></script>
  <script src="diario.js"></script>
</body>
</html>
